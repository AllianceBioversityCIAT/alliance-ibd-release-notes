<div class="scene" #scene aria-hidden="true">
  <img src="home/stage.webp" alt="" draggable="false" width="1408" height="768" fetchpriority="high">
  <div class="veil"></div>
  <canvas #gl></canvas>
</div>

<section class="screen" aria-label="Install the IBD Release Notes MCP">
  <div class="bezel">
    <header><span class="led"></span>IBD · RELEASE NOTES MCP<span class="status">ONLINE</span></header>
    <h1>Jira → Notion,<br>written for you</h1>
    <p class="step"><b>01</b> Paste this prompt into Claude Code, Cursor or any MCP client</p>
    <div class="prompt"><code>{{ typed() }}</code><span class="caret"></span></div>
    <button type="button" class="copy" [class.ok]="copied()" (click)="copy()">{{ copyLabel() }}</button>
    <p class="step"><b>02</b> Replace <i>&lt;YOUR_TOKEN&gt;</i> with your personal token — <strong>request it from the developer</strong>.</p>
    <div class="scan"></div>
  </div>
</section>
