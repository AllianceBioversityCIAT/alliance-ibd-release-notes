version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22.22.3
        - nvm use 22.22.3
        - node -v
        - npm ci
    build:
      commands:
        - npm run build
        - ./scripts/amplify-bundle.sh
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
